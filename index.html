<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse every issue of LUMIÈRE Magazine.">
  <meta property="og:title" content="Issue Library — LUMIÈRE Magazine">
  <meta property="og:description" content="Browse every issue of LUMIÈRE Magazine.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <title>Issue Library — LUMIÈRE Magazine</title>

  <style>
    :root {
      --red: #e21b2d;
      --ink: #0a0a0a;
      --paper: #ffffff;
      --soft: #f5f5f3;
      --line: #d9d9d7;
      --muted: #77736f;
      --serif: Georgia, "Times New Roman", serif;
      --sans: Arial, Helvetica, sans-serif;
      --shadow: 7px 7px 0 var(--ink);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--red); color: #fff; }

    header {
      position: relative;
      padding: clamp(65px, 10vw, 125px) 4.5vw clamp(45px, 6vw, 75px);
      border-bottom: 1px solid var(--ink);
      overflow: hidden;
      background:
        linear-gradient(90deg, transparent 0 49.9%, rgba(10, 10, 10, .045) 50%, transparent 50.1%),
        linear-gradient(0deg, transparent 0 49.9%, rgba(10, 10, 10, .045) 50%, transparent 50.1%);
    }

    header::before {
      content: "LUMIÈRE / MAGAZINE";
      display: flex;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 62px;
      padding: 0 4.5vw;
      border-bottom: 1px solid var(--line);
      color: var(--red);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
    }

    header::after {
      content: "ARCHIVE";
      position: absolute;
      right: 1vw;
      bottom: -18px;
      color: var(--red);
      font-family: var(--serif);
      font-size: clamp(90px, 18vw, 245px);
      font-weight: 900;
      letter-spacing: -.08em;
      line-height: .8;
      opacity: .065;
      pointer-events: none;
    }

    header h1 {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 0 0 25px;
      font-family: var(--serif);
      font-size: clamp(58px, 9vw, 135px);
      font-weight: 900;
      letter-spacing: -.055em;
      line-height: .84;
    }

    header h1::after { content: "."; color: var(--red); }

    header p {
      position: relative;
      z-index: 1;
      max-width: 420px;
      margin: 0;
      border-top: 4px solid var(--ink);
      padding-top: 15px;
      font-family: var(--serif);
      font-size: clamp(19px, 2.3vw, 27px);
      font-weight: 700;
      line-height: 1.15;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 55px 28px;
      align-items: start;
      max-width: 1380px;
      margin: 0 auto;
      padding: clamp(65px, 9vw, 110px) 4.5vw 100px;
    }

    .card { display: block; position: relative; }

    .cover {
      position: relative;
      width: 100%;
      background: var(--soft);
      border: 1px solid var(--ink);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .cover img {
      display: block;
      width: 100%;
      height: auto;
    }

    .cover .spine {
      position: absolute;
      z-index: 5;
      left: 0;
      top: 0;
      bottom: 0;
      width: 8px;
      background: linear-gradient(90deg, rgba(0, 0, 0, .28), transparent);
      pointer-events: none;
    }

    .card .meta { padding: 17px 1px 0; }

    .card .meta::before {
      content: "ISSUE";
      display: block;
      margin-bottom: 7px;
      color: var(--red);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .card .title {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.05;
    }

    #status {
      max-width: 1000px;
      margin: 70px auto 80px;
      padding: 55px 25px;
      border: 1px solid var(--ink);
      background: var(--soft);
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    #status[hidden] { display: none; }

    code {
      padding: 3px 6px;
      background: rgba(226, 27, 45, .08);
      color: var(--red);
      font-family: monospace;
    }

    @media (max-width: 1050px) {
      #grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 800px) {
      #grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 45px 24px;
      }
    }

    @media (max-width: 600px) {
      header { padding: 105px 20px 50px; }
      header::before { padding: 0 20px; font-size: 9px; }
      header h1 { font-size: clamp(52px, 16vw, 85px); letter-spacing: -.05em; }
      header p { font-size: 20px; }
      #grid { padding: 60px 20px 70px; gap: 40px 16px; }
      .cover { box-shadow: 5px 5px 0 var(--ink); }
      .card .title { font-size: 17px; }
      #status { margin-inline: 20px; }
    }

    @media (max-width: 390px) {
      #grid { grid-template-columns: 1fr; }
      .cover { max-width: 320px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Issue Library</h1>
    <p>Every issue of LUMIÈRE Magazine</p>
  </header>

  <main>
    <section id="grid" aria-label="Magazine issues"></section>

    <p id="status" hidden></p>
  </main>

  <script>
    (function () {
      // ---- Settings -------------------------------------------------
      // Folder that holds the cover images (relative to this page).
      var FOLDER = "Lumiere";

      // File types to look for, in this order. Names must be 1, 2, 3...
      var EXTENSIONS = ["jpg", "jpeg", "png", "webp", "JPG", "JPEG", "PNG", "WEBP"];

      // Stop searching after this many numbers in a row have no image.
      var MAX_GAPS = 3;

      // Safety limit so the page never searches forever.
      var MAX_ISSUES = 300;
      // ---------------------------------------------------------------

      var grid = document.getElementById("grid");
      var status = document.getElementById("status");

      function tryLoad(src) {
        return new Promise(function (resolve) {
          var img = new Image();
          img.onload = function () { resolve(src); };
          img.onerror = function () { resolve(null); };
          img.src = src;
        });
      }

      // Tries every extension for one number at the same time.
      // Prefers the first extension in the list if more than one exists.
      async function findCover(n) {
        var results = await Promise.all(
          EXTENSIONS.map(function (ext) {
            return tryLoad(FOLDER + "/" + n + "." + ext);
          })
        );
        for (var i = 0; i < results.length; i++) {
          if (results[i]) return results[i];
        }
        return null;
      }

      function addCard(n, src) {
        var card = document.createElement("div");
        card.className = "card";

        var cover = document.createElement("div");
        cover.className = "cover";

        var image = document.createElement("img");
        image.src = src;
        image.alt = "LUMIÈRE issue " + n + " cover";

        var spine = document.createElement("span");
        spine.className = "spine";
        spine.setAttribute("aria-hidden", "true");

        var meta = document.createElement("div");
        meta.className = "meta";

        var title = document.createElement("div");
        title.className = "title";
        title.textContent = "Issue " + n;

        cover.append(image, spine);
        meta.append(title);
        card.append(cover, meta);
        grid.appendChild(card);
      }

      (async function run() {
        var found = 0;
        var gaps = 0;

        for (var n = 1; n <= MAX_ISSUES && gaps < MAX_GAPS; n++) {
          var src = await findCover(n);
          if (src) {
            gaps = 0;
            found++;
            addCard(n, src);
          } else {
            gaps++;
          }
        }

        if (!found) {
          status.innerHTML =
            "No covers found. Add images named <code>1.jpg</code>, " +
            "<code>2.jpg</code>, <code>3.jpg</code>… to the " +
            "<code>" + FOLDER + "</code> folder, next to this page.";
          status.hidden = false;
        }
      })();
    })();
  </script>
</body>
</html>
